services:
  # ---------------------------------------------------------------------------
  # Microsoft SQL Server - relational database for Anima
  # ---------------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anima_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # SA password is pulled from the local .env file (MSSQL_SA_PASSWORD)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      # Persist database files across container restarts
      - mssql_data:/var/opt/mssql
    healthcheck:
      # Downstream services wait until SQL Server is actually accepting connections
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - anima_net

  # ---------------------------------------------------------------------------
  # One-shot seed: create the schema (db/init_db.sql) + load patients 1-129,
  # then exit. Idempotent (skips patients already present), so it's safe to
  # re-run on every `up`. NB: seed_dsm5.py resolves its defaults to /db and
  # /data, so those folders are bind-mounted below.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anima_seed
    restart: "no"                     # one-shot job - must NOT auto-restart
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      FERNET_KEY: ${FERNET_KEY}
    volumes:
      - ./app:/app                    # application code (WORKDIR)
      - ./db:/db:ro                   # init_db.sql (schema) -> /db/init_db.sql
      - ./data:/data:ro               # seed CSVs           -> /data/*.csv
      - mri_images:/app/static/mri_images
    command: ["python", "seed_dsm5.py"]
    networks:
      - anima_net

  # ---------------------------------------------------------------------------
  # FastAPI backend - orchestration layer + ML pipeline entrypoint
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anima_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Start the API only once SQL Server reports healthy
        condition: service_healthy
      seed:
        # ...and only once the database has been seeded
        condition: service_completed_successfully
    environment:
      # Database credentials + connection details (from .env)
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Symmetric key used by cryptography.fernet for field-level encryption
      FERNET_KEY: ${FERNET_KEY}
    volumes:
      # Live-mount source for development
      - ./app:/app
      # Raw MRI + CSV data, read-only, so seed_mri.py can be run via:
      #   docker exec anima_api python seed_mri.py --mri-dir /data/mri/<set>
      - ./data:/data:ro
      # Named volume for processed 2D MRI JPEG slices
      - mri_images:/app/static/mri_images
    networks:
      - anima_net

# -----------------------------------------------------------------------------
# Named volumes
# -----------------------------------------------------------------------------
volumes:
  mssql_data:
  mri_images:

# -----------------------------------------------------------------------------
# Private bridge network so services resolve each other by name (db, api)
# -----------------------------------------------------------------------------
networks:
  anima_net:
    driver: bridge
